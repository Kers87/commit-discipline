name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
          # ubuntu-latest is 26.04, where setup-python has no 3.8 build; test 3.8 on 24.04
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-24.04
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python hooks/test_scoped_commit.py --self-test
      - run: python hooks/test_commit_test_gate.py --self-test
      - run: python hooks/test_plan_gate.py --self-test
      - if: runner.os == 'Windows'
        run: python hooks/extra_scoped_commit.py
      - if: runner.os == 'Windows'
        run: python hooks/extra_commit_test_gate.py
      - if: runner.os == 'Windows'
        run: python hooks/extra_plan_gate.py
      - name: launcher finds a working Python
        shell: bash
        run: echo '{"tool_name":"Bash","tool_input":{"command":"git add -A"}}' | sh hooks/run.sh scoped_commit | grep -q '"deny"'
